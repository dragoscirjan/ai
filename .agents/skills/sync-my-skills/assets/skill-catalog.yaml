# yaml-language-server: $schema=./skill-catalog.schema.json
# One authored catalog: sources, installation, adaptation intent, selection, and deprecations.
# Installation argv describes an approved mechanism; inspection never executes it.
schemaVersion: 2
repository: https://github.com/dragoscirjan/ai
ref: main
defaults:
  exclude: [ agents/openai.yaml, "**/agents/openai.yaml", node_modules/**, .git/** ]
skills:
  asd-ste100-technical:
    kind: authored
    description: Write or revise technical responses, coding explanations, plans, reviews, documentation, error reports, and
      instructions with ASD-STE100-inspired plain language adapted for software work. Use for developer-facing prose
      that must be easy to read without losing technical precision.
    source:
      type: local
      path: .agents/skills/asd-ste100-technical
    category: communication
    selection: recommended
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, asd-ste100-technical ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  caveman:
    kind: authored
    description: Concise communication that preserves complete technical substance.
    source:
      type: local
      path: .agents/skills/caveman
    category: communication
    selection: optional
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, caveman ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  cleanup-workspaces:
    kind: authored
    description: Plan and safely remove clean integrated Git worktrees or Jujutsu workspaces, including one exact temporary
      orchestration lane, and prune safe stale registrations. Use for owner-authorized cleanup or current-task lane
      cleanup authorized by the orchestration workflow.
    source:
      type: local
      path: .agents/skills/cleanup-workspaces
    category: workspace
    selection: optional
    safety: destructive-with-confirmation
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ isolated-workspace ]
    runtime:
      - Requires Bun and either Git with worktree support or Jujutsu 0.38 or newer with workspace support.
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, cleanup-workspaces ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  code-review:
    kind: adapted
    description: "Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes: Standards
      (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating
      issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user
      wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\"."
    source:
      type: local
      path: .agents/skills/code-review
    upstream:
      type: github
      repository: https://github.com/mattpocock/skills
      revision: 59db609eb1e18aaf59b63284d0e52255aff0c63c
      path: skills/engineering/code-review
    category: review
    selection: optional
    safety: read-only-subagents
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    capabilities: [ parallel-subagents ]
    runtime:
      - Requires Git and a harness that can run two read-only subagents in parallel.
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, code-review ]
    adaptation:
      instructions: Preserve separate Standards and Spec reviews, read-only parallel reviewers, immutable Git endpoints, safe
        revision arguments, and the chosen comparison semantics. Reviewers must not mutate, publish, or delegate. Do not
        restore harness/model configuration.
      review:
        - Preserve substantive behavior and all mandatory prerequisites.
        - Show the diff and explain any target-specific change.
        - Keep required legal notices unchanged; omit agents/openai.yaml.
  coding:
    kind: authored
    description: Design, implement, refactor, review, or test code with project-first conventions, contextual engineering
      principles, risk-based security, behavior-focused tests, and applicable quality gates. Use for code work in any
      language; project instructions or the user select complementary language guidance.
    source:
      type: local
      path: .agents/skills/coding
    category: coding-base
    selection: detected
    safety: project-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      extensions:
        - .c
        - .cc
        - .cpp
        - .cxx
        - .gd
        - .go
        - .js
        - .jsx
        - .lua
        - .mjs
        - .php
        - .py
        - .rs
        - .sh
        - .swift
        - .ts
        - .tsx
        - .zig
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, coding ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  coding-with-rules:
    kind: authored
    description: Design, implement, refactor, review, or test code using the coding workflow plus on-demand language and
      file-extension rules. Use for source code and related toolchain, build, or test work in any language.
    source:
      type: local
      path: .agents/skills/coding-with-rules
    category: coding-wrapper
    selection: optional
    safety: project-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ coding ]
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, coding-with-rules ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  debloat:
    kind: authored
    description: Prevent overengineering during code design and implementation, or simplify existing code, configuration,
      dependencies, and abstractions through evidence-backed refactoring. Use when a direct solution may replace
      unnecessary mechanisms without weakening behavior, public contracts, security, or operational needs. Not for prose
      compression.
    source:
      type: local
      path: .agents/skills/debloat
    category: refactoring
    selection: optional
    safety: project-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, debloat ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  grilling:
    kind: upstream
    description: Stress-test a plan or decision through an explicit interview.
    source:
      type: github
      repository: https://github.com/mattpocock/skills
      revision: 95249b0b49782349740fd9b8c6ce32b4e59e497a
      path: skills/productivity/grilling
    category: interview
    selection: optional
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals: {}
    install:
      argv:
        [
          npx,
          -y,
          skills@1.7.4,
          add,
          https://github.com/mattpocock/skills/tree/95249b0b49782349740fd9b8c6ce32b4e59e497a/skills/productivity/grilling,
          --skill,
          grilling
        ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  document-project:
    kind: authored
    description: Create, improve, or maintain task-based VitePress or MkDocs documentation from verified code and project
      information. Use during implementation to keep affected documentation current and understandable to a developer
      new to the project, or for an approved documentation baseline, refactor, or migration.
    source:
      type: local
      path: .agents/skills/document-project
    category: documentation
    selection: recommended
    safety: project-write-with-confirmation
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, document-project ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  grill-me:
    kind: adapted
    description: A relentless interview to sharpen a plan or design.
    source:
      type: local
      path: .agents/skills/grill-me
    upstream:
      type: github
      repository: https://github.com/mattpocock/skills
      revision: fcf0071560d32913c9d4f820e0d7ca467c881619
      path: skills/productivity/grill-me
    category: interview-wrapper
    selection: optional
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ grilling ]
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, grill-me ]
    adaptation:
      instructions: Keep the maintained interview wrapper and its grilling prerequisite. Replace harness-specific Skill-tool
        calls with portable entry instructions. Do not add provider/model configuration.
      review:
        - Preserve substantive behavior and all mandatory prerequisites.
        - Show the diff and explain any target-specific change.
        - Keep required legal notices unchanged; omit agents/openai.yaml.
  init-project:
    kind: authored
    description: Initialize or adopt the shared project foundation, TypeScript tooling, or Godot GDScript tooling through
      on-demand setup references and bundled helpers. Use for explicitly requested initialization, not ordinary coding
      or automatic setup during installation.
    source:
      type: local
      path: .agents/skills/init-project
    category: initializer
    selection: initializer
    safety: project-and-user-write
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    runtime:
      - Requires Git, mise, and Bun with Bun.TOML.parse. Initialized targets require an approved Node 24-or-newer/pnpm
        control plane; GDScript also needs an explicitly selected compatible Godot toolchain. Installation and lockfile
        updates require approval.
    signals:
      askWithoutSignals: true
      files:
        - project.godot
        - tsconfig.json
      extensions:
        - .gd
        - .ts
        - .tsx
        - .mts
        - .cts
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, init-project ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  initiative:
    kind: authored
    description: Turn an idea and evidence into an agreed outcome-level brief. Use to establish why work matters, its scope,
      and success measures before detailed specifications or execution.
    source:
      type: local
      path: .agents/skills/initiative
    category: planning
    selection: optional
    safety: document-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ grilling ]
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, initiative ]
  instruction-maintenance:
    kind: authored
    description: Diagnose and propose human-approved updates when agent instructions, deferred-document relationships, or
      skill routing metadata are missing, stale, conflicting, duplicated, or unsuitable for the observed workflow. Use
      when repository instructions no longer fit the work. Loading this skill authorizes a read-only audit and exact
      proposal, not mutation.
    source:
      type: local
      path: .agents/skills/instruction-maintenance
    category: instruction-policy
    selection: optional
    safety: read-only-until-approved
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, instruction-maintenance ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  isolated-workspace:
    kind: authored
    description: Plan, create, or reuse one isolated Git worktree or Jujutsu workspace before repository mutation. Use
      before architecture, code, documentation, configuration, or policy changes. Requires an explicit VCS and branch or
      bookmark name while detecting repository and workspace paths automatically.
    source:
      type: local
      path: .agents/skills/isolated-workspace
    category: workspace
    selection: optional
    safety: project-vcs-write-with-confirmation
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    runtime:
      - Requires Bun and either Git with worktree support or Jujutsu 0.38 or newer with workspace support.
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, isolated-workspace ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  plan-tasks:
    kind: authored
    description: Divide a specification or clear scope into bounded, verifiable tasks. Use when work needs sequencing,
      dependencies, or execution across multiple sessions or workers.
    source:
      type: local
      path: .agents/skills/plan-tasks
    category: planning
    selection: optional
    safety: document-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, plan-tasks ]
  research:
    kind: authored
    description: Research a user's question or idea, with or without an existing project. Use when the user asks for sourced
      findings, comparisons, feasibility checks, or an investigation of a topic.
    source:
      type: local
      path: .agents/skills/research
    category: research
    selection: optional
    safety: document-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ grilling ]
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, research ]
  retro:
    kind: authored
    description: Examine a bounded work period and propose evidence-backed process improvements. Use to learn from
      clarification, research, planning, implementation, checks, review, tools, or handoffs.
    source:
      type: local
      path: .agents/skills/retro
    category: review
    selection: optional
    safety: document-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, retro ]
  scaffold:
    kind: authored
    description: Create real source skeleton files for an approved feature without implementing its behavior. Use to
      establish minimal files, types, signatures, and contracts in an isolated workspace, then stop at a scaffold-only
      handoff or authorized pull request.
    source:
      type: local
      path: .agents/skills/scaffold
    category: design
    selection: optional
    safety: project-write-with-confirmation
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, scaffold ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  specify:
    kind: authored
    description: Record agreed behavior as a compact specification for implementation and review. Use when requirements need
      durable acceptance criteria, constraints, and test boundaries.
    source:
      type: local
      path: .agents/skills/specify
    category: planning
    selection: optional
    safety: document-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ grilling ]
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, specify ]
  subagent-orchestration:
    kind: authored
    description: Bound and coordinate child-agent workers, read-only reviewers, isolated temporary lanes, integration,
      validation, and lane cleanup. Use before delegating any task to child agents.
    source:
      type: local
      path: .agents/skills/subagent-orchestration
    category: orchestration
    selection: optional
    safety: bounded-child-agents-and-workspace-lanes
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    runtime:
      - Requires a harness with child-agent support; writable parallel lanes also need owner-approved workspace creation
        and exact-lane cleanup procedures.
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, subagent-orchestration ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  sync-my-skills:
    kind: authored
    description: Inspect a project's purpose and installed skills, recommend from the curated YAML catalog, ask about every
      remaining skill and exact deprecated removals, then stage, adapt, and synchronize only an approved plan. Use
      /sync-my-skills across projects; leave root instruction documents unchanged.
    source:
      type: local
      path: .agents/skills/sync-my-skills
    scope: personal
    category: asset-manager
    selection: optional
    safety: project-write-with-confirmation
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    runtime:
      - Requires Node.js 22.20 or newer, Git, and the pinned yaml dependency installed during approved personal setup.
        Target writes require an isolated Git worktree.
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, sync-my-skills, --global ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  systematic-debugging:
    kind: adapted
    description: Diagnose bugs, failing tests, regressions, flaky behavior, and unexpected results through evidence,
      root-cause tracing, and single-hypothesis experiments before proposing fixes. Use for debugging in any language,
      including failures across component or environment boundaries.
    source:
      type: local
      path: .agents/skills/systematic-debugging
    upstream:
      type: github
      repository: https://github.com/obra/superpowers
      revision: 22f0b463e7a5e579904dd6211a520321035526f7
      path: skills/systematic-debugging
    category: debugging
    selection: optional
    safety: project-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, systematic-debugging ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
    adaptation:
      instructions: Use the substantial maintained local variant, not a wholesale upstream replacement. Preserve
        evidence-first root-cause diagnosis, single-hypothesis experiments, boundary checks and reassessment after
        repeated failures. Keep target-owned implementation/validation/workspace handoffs; do not import executable
        utilities or new Superpowers dependencies.
      review:
        - Preserve substantive behavior and all mandatory prerequisites.
        - Show the diff and explain any target-specific change.
        - Keep required legal notices unchanged; omit agents/openai.yaml.
  tdd:
    kind: adapted
    description: Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions
      "red-green-refactor", or wants integration tests.
    source:
      type: local
      path: .agents/skills/tdd
    upstream:
      type: github
      repository: https://github.com/mattpocock/skills
      revision: 4ae2317ddb22b046e26455e4f9c9b3aaaf62212d
      path: skills/engineering/tdd
    category: testing
    selection: optional
    safety: project-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, dragoscirjan/ai, --skill, tdd ]
    adaptation:
      instructions: Keep the maintained testing workflow, behavior-focused examples, module responsibilities and public test
        seams. Replace mandatory codebase-design/Skill-tool coupling with self-contained guidance. Preserve the
        red-before-green loop and its documented later review/refactoring stage. Do not introduce a model or provider
        requirement.
      review:
        - Preserve substantive behavior and all mandatory prerequisites.
        - Show the diff and explain any target-specific change.
        - Keep required legal notices unchanged; omit agents/openai.yaml.
  unslop:
    kind: upstream
    description: Remove AI-generated prose patterns while preserving meaning.
    source:
      type: github
      repository: https://github.com/cursor/plugins
      revision: bc697d0a5a163cec979e362b601e36f5616083fd
      path: pstack/skills/unslop
    category: communication
    selection: recommended
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv:
        [
          npx,
          -y,
          skills@1.7.4,
          add,
          https://github.com/cursor/plugins/tree/bc697d0a5a163cec979e362b601e36f5616083fd/pstack/skills/unslop,
          --skill,
          unslop
        ]
    legal:
      - path: pstack/LICENSE
        target: LICENSE
        spdx: MIT
  wait-what:
    kind: upstream
    description: Explain the current proposal again with simpler language and missing context.
    source:
      type: github
      repository: https://github.com/mattpocock/skills
      revision: d80fa0f4ebe0c5714af0adf8670336065233ecc6
      path: skills/productivity/wait-what
    category: communication-wrapper
    selection: optional
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv:
        [
          npx,
          -y,
          skills@1.7.4,
          add,
          https://github.com/mattpocock/skills/tree/d80fa0f4ebe0c5714af0adf8670336065233ecc6/skills/productivity/wait-what,
          --skill,
          wait-what
        ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
